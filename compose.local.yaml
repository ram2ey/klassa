services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: klassa
      POSTGRES_USER: klassa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - klassa_local_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U klassa -d klassa"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  klassa_local_postgres:
