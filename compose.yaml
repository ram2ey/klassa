services:
  web:
    build:
      context: .
      target: runner
    restart: unless-stopped
    init: true
    environment:
      SERVICE_URL_WEB_3000: /
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: klassa
      PGUSER: ${SERVICE_USER_POSTGRES:-klasso}
      PGPASSWORD: ${SERVICE_PASSWORD_64_POSTGRES:-}
      DATABASE_URL: postgresql://${SERVICE_USER_POSTGRES:-klasso}:${SERVICE_PASSWORD_64_POSTGRES:-}@postgres:5432/klassa
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
      BETTER_AUTH_URL: ${SERVICE_URL_WEB_3000}
      BETTER_AUTH_SECRET: ${SERVICE_REALBASE64_64_AUTH}
      SENSITIVE_RECORD_ENCRYPTION_KEY: ${SERVICE_REALBASE64_64_RECORDS}
      KLASSO_DEMO_MODE: "false"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  migrate:
    build:
      context: .
      target: migrator
    restart: "no"
    exclude_from_hc: true
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: klassa
      PGUSER: ${SERVICE_USER_POSTGRES:-klasso}
      PGPASSWORD: ${SERVICE_PASSWORD_64_POSTGRES:-}
      DATABASE_URL: postgresql://${SERVICE_USER_POSTGRES:-klasso}:${SERVICE_PASSWORD_64_POSTGRES:-}@postgres:5432/klassa
      KLASSO_DEMO_MODE: "false"
      KLASSO_BOOTSTRAP_PHONE: ${KLASSO_BOOTSTRAP_PHONE:-}
      KLASSO_BOOTSTRAP_NAME: ${KLASSO_BOOTSTRAP_NAME:-}
      KLASSO_BOOTSTRAP_PASSWORD: ${KLASSO_BOOTSTRAP_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: klassa
      POSTGRES_USER: ${SERVICE_USER_POSTGRES:-klasso}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_64_POSTGRES:-klasso_secure_password_dev}
    volumes:
      - klassa_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER:-klasso}\" -d \"$${POSTGRES_DB:-klassa}\""]
      interval: 5s
      timeout: 5s
      retries: 8
      start_period: 5s

volumes:
  klassa_postgres:
