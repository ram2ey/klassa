services:
  web:
    build:
      context: .
      target: runner
    restart: unless-stopped
    init: true
    environment:
      SERVICE_URL_WEB_3000: /
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: klassa
      PGUSER: klassa_app
      PGPASSWORD: ${SERVICE_PASSWORD_64_APP}
      DATABASE_URL: postgresql://klassa_app:${SERVICE_PASSWORD_64_APP}@postgres:5432/klassa
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?Set BETTER_AUTH_URL to the public HTTPS origin}
      BETTER_AUTH_SECRET: ${SERVICE_REALBASE64_64_AUTH}
      SENSITIVE_RECORD_ENCRYPTION_KEY: ${SERVICE_REALBASE64_64_RECORDS}
      KLASSO_DEMO_MODE: "false"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  migrate:
    build:
      context: .
      target: migrator
    restart: "no"
    exclude_from_hc: true
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: klassa
      PGUSER: ${SERVICE_USER_POSTGRES:-klasso}
      PGPASSWORD: ${SERVICE_PASSWORD_64_POSTGRES:-}
      DATABASE_URL: postgresql://${SERVICE_USER_POSTGRES:-klasso}:${SERVICE_PASSWORD_64_POSTGRES:-}@postgres:5432/klassa
      KLASSO_DEMO_MODE: "false"
      KLASSO_APP_DATABASE_PASSWORD: ${SERVICE_PASSWORD_64_APP}
      KLASSO_SMS_WORKER_PASSWORD: ${SERVICE_PASSWORD_64_SMS}
      KLASSO_BOOTSTRAP_USERNAME: ${KLASSO_BOOTSTRAP_USERNAME:-}
      KLASSO_BOOTSTRAP_NAME: ${KLASSO_BOOTSTRAP_NAME:-}
      KLASSO_BOOTSTRAP_PASSWORD: ${KLASSO_BOOTSTRAP_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy

  sms-worker:
    profiles: ["sms"]
    build:
      context: .
      target: sms-worker
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: klassa
      PGUSER: klassa_sms_worker
      PGPASSWORD: ${SERVICE_PASSWORD_64_SMS}
      MNOTIFY_API_KEY: ${MNOTIFY_API_KEY:-}
      MNOTIFY_SENDER_ID: ${MNOTIFY_SENDER_ID:-}
      SMS_DELIVERY_ENABLED: ${SMS_DELIVERY_ENABLED:-false}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "const fs=require('fs');const age=Date.now()-Number(fs.readFileSync('/tmp/klassa-sms-worker-heartbeat','utf8'));process.exit(age<60000?0:1)"]
      interval: 30s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: klassa
      POSTGRES_USER: ${SERVICE_USER_POSTGRES:-klasso}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_64_POSTGRES:-klasso_secure_password_dev}
    volumes:
      - klassa_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER:-klasso}\" -d \"$${POSTGRES_DB:-klassa}\""]
      interval: 5s
      timeout: 5s
      retries: 8
      start_period: 5s

volumes:
  klassa_postgres:
